<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Morya Essentials | Premium Kapoor for Spiritual Rituals</title>
    <meta name="description" content="Explore our premium Kapoor products at Morya Essentials. Sourced from sacred lands, perfect for daily puja and spiritual practices.">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant:wght@400;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8B4513;
            --bg-color: #FFFFFF;
        }
        body {
            font-family: 'Libre Baskerville', serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: var(--bg-color);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--primary-color);
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        nav a {
            text-decoration: none;
            color: var(--primary-color);
            font-family: 'Cormorant', serif;
            font-size: 18px;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #333;
        }
        .cta-button {
            background-color: var(--primary-color);
            color: var(--bg-color);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-family: 'Cormorant', serif;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .cta-button:hover {
            background-color: #333;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            padding: 50px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background-color: var(--bg-color);
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            transition: box-shadow 0.3s;
        }
        .product-card:hover {
            box-shadow: 0 0 15px var(--primary-color);
        }
        .product-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2em;
            margin-bottom: 10px;
        }
        .product-card p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .spiritual-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            fill: var(--primary-color);
        }
        @media (max-width: 768px) {
            .products { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="trust.html">Trust</a>
            <a href="contact.html">Contact</a>
            <button class="cta-button" onclick="window.location.href='order.html'">Order Now</button>
        </nav>
    </header>
    <section class="products">
        <div class="product-card">
            <svg class="spiritual-icon" viewBox="0 0 100 100" fill="var(--primary-color)">
                <path d="M50 10c-10 0-20 10-20 20s10 20 20 20 20-10 20-20-10-20-20-20zm0 30c-5 0-10-5-10-10s5-10 10-10 10 5 10 10-5 10-10 10z"/>
                <path d="M20 50h60v10H20z"/>
            </svg>
            <h2>Premium Kapoor</h2>
            <p>Sourced from sacred lands, purified by faith for your daily rituals. Elevate your spiritual practice with our spiritual-grade Kapoor.</p>
            <button class="cta-button" onclick="window.location.href='order.html'">Order Now</button>
        </div>
    </section>
    <script>
        const colors = ['#8B4513', '#87CEEB', '#800080', '#FFA500', '#FFC0CB'];
        const hour = new Date().getHours();
        const colorIndex = hour % 5;
        document.documentElement.style.setProperty('--primary-color', colors[colorIndex]);
    </script>
</body>
</html>
