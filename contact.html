<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Morya Essentials | Get in Touch for Spiritual Kapoor</title>
    <meta name="description" content="Contact Morya Essentials for inquiries about our premium Kapoor. Reach us via mobile or email for faith-based spiritual products.">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant:wght@400;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8B4513; /* Default to Brown; JS will update */
            --bg-color: #FFFFFF;
        }
        body {
            font-family: 'Libre Baskerville', serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: var(--bg-color);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--primary-color);
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        nav a {
            text-decoration: none;
            color: var(--primary-color);
            font-family: 'Cormorant', serif;
            font-size: 18px;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #333;
        }
        .cta-button {
            background-color: var(--primary-color);
            color: var(--bg-color);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-family: 'Cormorant', serif;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .cta-button:hover {
            background-color: #333;
        }
        .contact-section {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .contact-section h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            margin-bottom: 40px;
        }
        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background-color: var(--bg-color);
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            padding: 20px;
            transition: box-shadow 0.3s;
        }
        .contact-item:hover {
            box-shadow: 0 0 15px var(--primary-color);
        }
        .contact-item svg {
            width: 40px;
            height: 40px;
            fill: var(--primary-color);
        }
        .contact-item p {
            font-size: 18px;
            margin: 0;
        }
        @media (max-width: 768px) {
            .contact-section h1 { font-size: 2em; }
            .contact-item { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="trust.html">Trust</a>
            <a href="contact.html">Contact</a>
            <button class="cta-button" onclick="window.location.href='order.html'">Order Now</button>
        </nav>
    </header>
    <section class="contact-section">
        <h1>Contact Us</h1>
        <div class="contact-details">
            <div class="contact-item">
                <svg viewBox="0 0 100 100" fill="var(--primary-color)">
                    <path d="M50 10c-13.8 0-25 11.2-25 25s11.2 25 25 25 25-11.2 25-25-11.2-25-25-25zm0 40c-8.3 0-15-6.7-15-15s6.7-15 15-15 15 6.7 15 15-6.7 15-15 15z"/>
                    <path d="M50 30c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5z"/>
                    <path d="M20 60h60v10H20z"/>
                </svg>
                <p><strong>Mobile:</strong> 8767231315</p>
            </div>
            <div class="contact-item">
                <svg viewBox="0 0 100 100" fill="var(--primary-color)">
                    <path d="M10 30h80v40H10z"/>
                    <path d="M10 30l40 20 40-20"/>
                </svg>
                <p><strong>Email:</strong> help.moryatraders@gmail.com</p>
            </div>
        </div>
    </section>
    <script>
        const colors = ['#8B4513', '#87CEEB', '#800080', '#FFA500', '#FFC0CB'];
        const hour = new Date().getHours();
        const colorIndex = hour % 5;
        document.documentElement.style.setProperty('--primary-color', colors[colorIndex]);
    </script>
</body>
</html>
