<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morya Essentials - Pure by Faith | Premium Spiritual Kapoor</title>
    <meta name="description" content="Discover Morya Essentials, offering pure Kapoor sourced from sacred lands. Elevate your spiritual rituals with faith-based purity and premium quality.">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant:wght@400;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #8B4513;
            --bg-color: #FFFFFF;
        }

        body {
            font-family: 'Libre Baskerville', serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding-top: 10px; /* page cut issue fix */
            line-height: 1.6;
        }

        header {
    background-color: var(--bg-color);
    padding: 10px 12px;   /* 👈 vertical space kam */
    text-align: center;
    border-bottom: 1px solid var(--primary-color);
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: var(--primary-color);
            font-family: 'Cormorant', serif;
            font-size: 18px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #333;
        }

        .cta-button {
            background-color: var(--primary-color);
            color: var(--bg-color);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-family: 'Cormorant', serif;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .cta-button:hover {
            background-color: #333;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            animation: fadeIn 2s ease-in;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4em;
            margin: 0;
        }

        .hero p {
            font-family: 'Cormorant', serif;
            font-size: 2em;
            margin: 10px 0 30px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
    .hero h1 { font-size: 2.5em; }
    .hero p { font-size: 1.5em; }

    nav {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
    }

    nav a {
        font-size: 16px;
    }

    .cta-button {
        padding: 8px 14px;
        font-size: 16px;
    }
        }
</head>

<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="trust.html">Trust</a>
        <a href="contact.html">Contact</a>
        <button class="cta-button" onclick="window.location.href='order.html'">Order Now</button>
    </nav>
</header>

<section class="hero">
    <h1>Morya Essentials</h1>
    <p>Pure by Faith</p>

    <button class="cta-button" onclick="window.location.href='products.html'">
        View Product
    </button>
</section>

<script>
    const colors = ['#8B4513', '#87CEEB', '#800080', '#FFA500', '#FFC0CB'];
    const hour = new Date().getHours();
    const colorIndex = hour % colors.length;
    document.documentElement.style.setProperty('--primary-color', colors[colorIndex]);
</script>

</body>
</html>
